<!--
  PLANTILLA ADVANZ REPORTING · punto de partida
  1. Copiá este archivo a empresa/clientes/<cliente>/reportes/YYYY-MM-DD_reporte-<tipo>.html
  2. Reemplazá [CLIENTE]/[TÍTULO]/[PERÍODO] y llená los bloques (ver references/estructura.md).
  3. Poné placeholders src="PROD1"/"AD1"... en las imágenes y embebelas con el script (references/design-system.md).
  4. Tono neutral, español neutro, sin tecnicismos (references/tono-voz.md).
  El degradado del título/tesis y el borde de los .read son identidad de marca intencional.
-->
<meta charset="utf-8">
<title>[CLIENTE] · [TÍTULO]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4fb; --card:#ffffff; --line:#e7e2f2; --ink:#12101a; --text:#211c33; --muted:#6b6580;
    --violet:#c15dff; --violet-deep:#7b2ff7; --cyan:#22d3ee;
    --green:#16a34a; --green-bg:#e7f7ee; --red:#dc2626; --red-bg:#fdeaea; --amber:#d97706; --amber-bg:#fdf3e4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px 76px}
  header{padding:56px 0 32px;border-bottom:1px solid var(--line)}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--violet-deep);font-weight:600;margin-bottom:17px}
  h1{font-family:'Space Grotesk','Poppins',sans-serif;font-size:clamp(30px,5vw,46px);font-weight:700;line-height:1.12;letter-spacing:-.02em;margin-bottom:13px;color:var(--ink)}
  h1 em{font-style:normal;background:linear-gradient(100deg,var(--violet-deep),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--muted);font-size:15px}
  nav{position:sticky;top:0;z-index:20;background:rgba(246,244,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-bottom:44px}
  nav .in{max-width:1000px;margin:0 auto;padding:13px 24px;display:flex;gap:19px;overflow-x:auto;scrollbar-width:none}
  nav .in::-webkit-scrollbar{display:none}
  nav a{color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:500;white-space:nowrap} nav a:hover{color:var(--violet-deep)}
  section{margin-bottom:52px;scroll-margin-top:66px}
  h2{font-family:'Space Grotesk','Poppins',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px;color:var(--ink);display:flex;align-items:baseline;gap:12px}
  h2 .n{font-size:13px;color:var(--violet);font-weight:600}
  .win{font-size:11.5px;color:var(--muted);margin-bottom:20px;font-weight:500;font-family:'Space Grotesk',sans-serif;letter-spacing:.06em}
  h3{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:26px 0 12px;color:var(--violet-deep)}
  h3 .hs{color:var(--muted);font-weight:400;font-size:13px}
  p.lead{color:var(--muted);font-size:14px;margin-bottom:16px}
  .tesis{font-family:'Space Grotesk',sans-serif;font-size:clamp(16px,2.3vw,19px);font-weight:600;line-height:1.42;color:var(--ink);margin-bottom:22px}
  .tesis span{background:linear-gradient(100deg,var(--violet-deep),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
  .kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;font-weight:600}
  .kpi .v{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
  .kpi .d{font-size:11.5px;color:var(--muted);margin-top:5px} .kpi .d b{color:var(--green);font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px}
  .mc{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;text-align:center}
  .mc .st{font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px}
  .mc .sv{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .mc .sd{font-size:11px;color:var(--muted);margin-top:5px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:6px}
  .tw{overflow-x:auto;margin-bottom:16px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:300px}
  th{background:#faf8ff;text-align:left;padding:11px 14px;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:'Space Grotesk',sans-serif;border-bottom:1px solid var(--line)}
  td{padding:11px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none} td.num,th.num{text-align:right} tr.hl td{background:#f0fdf4}
  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .up{background:var(--green-bg);color:var(--green)} .nt{background:#f4f0fc;color:var(--violet-deep)} .dn{background:var(--red-bg);color:var(--red)}
  .read{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:0 12px 12px 0;padding:15px 19px;margin-bottom:16px;font-size:14px}
  .read b{color:var(--violet-deep);font-weight:600}
  .gcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .gauge{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
  .gauge .gt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .gauge .gn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink)}
  .gauge .gv{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--violet-deep);font-variant-numeric:tabular-nums}
  .gbar{height:13px;border-radius:8px;background:#f0ecfa;overflow:hidden;margin-bottom:7px}
  .gbar span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--violet-deep),var(--cyan))}
  .glost{font-size:11.5px;color:var(--muted)}
  .crvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
  .crv{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .crv .cvh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
  .crv .cvimg{width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);background:#f4f0fc}
  .crv .cvhead{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .crv .cvn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;color:var(--ink);line-height:1.3}
  .crv .cvtag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:5px;background:#f4f0fc;color:var(--violet-deep);white-space:nowrap;align-self:flex-start}
  .crv .cvr{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
  .crv .cvr .rv{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
  .crv .cvr .rl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .crv .cvm{display:flex;gap:15px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--line);padding-top:9px}
  .crv .cvm b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;display:block;font-size:13px;letter-spacing:0;text-transform:none;margin-top:2px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;margin-bottom:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .pcard .pimg{aspect-ratio:1/1;background:#f4f0fc} .pcard .pimg img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard .pb{padding:12px 14px;display:flex;flex-direction:column;gap:3px}
  .pcard .pn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;color:var(--ink);line-height:1.3;min-height:31px}
  .pcard .pf{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--violet-deep)}
  .pcard .po{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-top:2px}
  .funnel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
  .fn{margin-bottom:13px} .fn:last-child{margin-bottom:0}
  .fn .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .fn .nm{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink)}
  .fn .ct{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums} .fn .ct span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
  .fbar{height:24px;border-radius:8px;background:#f0ecfa;overflow:hidden} .fbar span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--violet-deep),var(--violet))}
  .drop{font-size:11.5px;color:var(--muted);margin:5px 0 0 2px}
  .split{display:flex;height:40px;border-radius:11px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}
  .split .a{background:linear-gradient(135deg,var(--violet-deep),var(--violet));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px}
  .split .b{background:#efeafb;display:flex;align-items:center;justify-content:center;color:var(--violet-deep);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px}
  .lg{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-bottom:8px} .lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  .act{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 20px;margin-bottom:11px;display:flex;gap:15px;align-items:flex-start}
  .act .num{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--violet);line-height:1.2;min-width:20px}
  .act .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;margin-bottom:5px;color:var(--ink)}
  .act .r{font-size:13.5px;color:var(--muted)} .act .r b{color:var(--text);font-weight:500}
  .note{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px;padding-left:12px;border-left:2px solid var(--line)}
  footer{border-top:1px solid var(--line);padding-top:24px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px} footer b{color:var(--violet-deep)}
  @media(max-width:640px){.grid,.tiles{grid-template-columns:repeat(2,1fr)}.cols,.gcols{grid-template-columns:1fr}header{padding:40px 0 28px}}
</style>

<div class="wrap">
  <header>
    <div class="brand">Advanz · Paid Media</div>
    <h1>[TÍTULO] <em>[destacado]</em></h1>
    <p class="sub">[CLIENTE] · [PERÍODO] · [fuentes]</p>
  </header>

  <!-- 01 · El mes en una mirada: <p class="tesis"> + <div class="grid"> de .kpi + un .read -->
  <!-- 02 · Cómo venimos: <div class="cols"> con dos tablas (MoM / YoY) + .read (escala vs eficiencia) -->
  <!-- 03 · De dónde vino la venta: tabla de canales por rol + <div class="gcols"> con dos .gauge -->
  <!-- 04 · Campañas y anuncios: tablas Meta/Google + <div class="crvg"> de .crv (con miniatura) -->
  <!-- 05 · Qué se vendió: <div class="pgrid"> de .pcard (con foto) -->
  <!-- 06 · Tienda: <div class="funnel"> + <div class="split"> nuevos vs recurrentes -->
  <!-- 07 · Contenido: .read + <div class="tiles"> (fatiga/volumen) -->
  <!-- 08 · Próximos pasos: .act numerados con postura + decisiones a validar -->

  <footer>
    <div>[CLIENTE] · [TÍTULO]</div>
    <div>Preparado por <b>Advanz · Paid Media</b></div>
  </footer>
</div>
